name: pdu_poll

services:
  poller:
    image: ubuntu:latest
    networks:
      - backend
    #command: bash -c "apt-get update && apt-get install curl -y && curl -o /root/setup.sh https://raw.githubusercontent.com/RJ-246/byu-dc-pdupoller/main/setup.sh && bash ./root/setup.sh && tail -f /dev/null"
    command: bash -c "apt-get update && apt-get install curl -y && bash ./root/setup.sh && tail -f /dev/null"
    volumes:
      - poll-data:/root
      - ./:/root/

  grafana:
    image: grafana/grafana-oss:latest
    networks:
      #- frontend
      - backend
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
  prometheus:
    image: prom/prometheus:latest
    networks:
      - backend
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

networks:
  #frontend:
  #driver: bridge
  backend:
    driver: bridge

volumes:
  grafana-data:
  poll-data:
  prometheus-data:
